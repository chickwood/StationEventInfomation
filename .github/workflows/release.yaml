name: release-bin

on:
  push:
    tags:
      - 'v*' # 当本地脚本推送 v* 标签时物理触发

jobs:
  release:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Package Files
        run: |
          tag="${GITHUB_REF_NAME#v}"
          IFS='.' read -r year month day <<< "$tag"

          if ! [[ "$year" =~ ^[0-9]+$ && "$month" =~ ^[0-9]+$ && "$day" =~ ^[0-9]+$ ]]; then
            echo "::error::Unexpected tag format: ${GITHUB_REF_NAME} (expected vyyyy.M.d)"
            exit 1
          fi

          date_tag="$(printf '%04d%02d%02d' "$((10#$year))" "$((10#$month))" "$((10#$day))")"

          files=()
          for f in station_data_xyz.bin event_data.ndjson; do
            if [ -f "$f" ]; then
              files+=("$f")
            else
              echo "::warning::Skipping missing file: $f"
            fi
          done

          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning::No files to package, skipping zip creation."
            exit 0
          fi

          sha256sum "${files[@]}" > SHA256SUMS
          files+=("SHA256SUMS")

          tmp_zip="$(mktemp -u --suffix=.zip station-event.XXXXXXXX)"
          zip -j "$tmp_zip" "${files[@]}"
          mv -f "$tmp_zip" "station-event.${date_tag}.zip"

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v3.0.3
        with:
          name: "Release ${{ github.ref_name }}"
          files: |
            station-event.*.zip
          generate_release_notes: false
          body: ""
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
