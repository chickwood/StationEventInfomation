name: release-bin

on:
  push:
    tags:
      - 'v*' # 当本地脚本推送 v* 标签时物理触发

jobs:
  release:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Package Data Files
        run: |
          files=()
          for f in station_data_xyz.bin event_data.json; do
            if [ -f "$f" ]; then
              sha256sum "$f" > "$f.sha256"
              files+=("$f" "$f.sha256")
            else
              echo "::warning::Skipping missing file: $f"
            fi
          done

          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning::No files to package, skipping zip creation."
            exit 0
          fi

          zip -j station_event_data.zip "${files[@]}"

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v3.0.3
        with:
          name: "Release ${{ github.ref_name }}"
          files: |
            station_event_data.zip
          generate_release_notes: false
          body: ""
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
